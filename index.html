<style>
* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #fff5f7, #f6d6de);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden; /* keep background locked */
}

/* ---------- CARD ---------- */
.card {
  width: 430px;
  max-width: 95%;
  max-height: 90vh;              /* 👈 enables scrolling */
  overflow-y: auto;              /* 👈 scroll inside card */
  background: rgba(255,255,255,0.97);
  border-radius: 32px;
  padding: 2.8rem 2.2rem;
  text-align: center;
  box-shadow:
    0 35px 70px rgba(190,90,120,0.35),
    inset 0 0 0 1px rgba(255,182,193,0.6);
  animation: appear 1s ease;
  position: relative;
  scrollbar-width: none;         /* Firefox */
}

.card::-webkit-scrollbar {
  width: 0px;                    /* Chrome/Safari */
}

.hidden { display: none; }

/* ---------- TEXT ---------- */
h1 {
  font-family: 'Playfair Display', serif;
  color: #c94b6a;
  font-size: 1.9rem;
  line-height: 1.3;
  margin-bottom: 1rem;
}

p {
  color: #555;
  font-size: 1rem;
  line-height: 1.6;
  margin: 0.7rem 0;
}

/* ---------- IMAGE ---------- */
.frame {
  width: 100%;
  height: 320px;
  border-radius: 22px;
  overflow: hidden;
  margin: 1.6rem 0;
  border: 2px solid rgba(255,182,193,0.6);
  box-shadow: 0 18px 35px rgba(255,105,135,0.3);
}

.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ---------- BUTTONS ---------- */
.buttons {
  margin-top: 2.2rem;
  position: relative;
  height: 100px;
}

button {
  padding: 15px 36px;
  border-radius: 60px;
  font-size: 1rem;
  font-family: 'Poppins', sans-serif;
  cursor: pointer;
  transition: all 0.35s ease;
  letter-spacing: 0.4px;
}

/* YES */
.yes-btn {
  background: linear-gradient(120deg, #ff6f91, #ffc1cc, #ff6f91);
  background-size: 200% 200%;
  color: white;
  border: none;
  box-shadow: 0 14px 32px rgba(255,105,135,0.55);
  animation: glow 4s infinite;
}

.yes-btn:hover {
  transform: translateY(-4px) scale(1.07);
}

/* NO */
.no-btn {
  background: white;
  color: #c94b6a;
  border: 2px dashed #ff9eb2;
  position: absolute;
}

/* ---------- BACK ---------- */
.back {
  position: absolute;
  top: 18px;
  left: 18px;
  background: transparent;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  color: #c94b6a;
}

/* ---------- FLOATING HEARTS ---------- */
.heart {
  position: fixed;
  bottom: -20px;
  animation: float 5s linear forwards;
  pointer-events: none;
  opacity: 0.9;
}

@keyframes float {
  to {
    transform: translateY(-120vh) scale(1.6);
    opacity: 0;
  }
}

/* ---------- ANIMATIONS ---------- */
@keyframes appear {
  from { opacity: 0; transform: scale(0.9) translateY(15px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes glow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
</style>
