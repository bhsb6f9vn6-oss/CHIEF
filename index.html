<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌌 A Cosmic Question</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #0b0f2b, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  color: #fff;
}

/* ------------------ STARRY BACKGROUND ------------------ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(2px 2px at 20% 30%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 70% 60%, #fff, transparent),
    radial-gradient(1px 1px at 40% 80%, #fff, transparent),
    radial-gradient(2px 2px at 80% 20%, #fff, transparent);
  animation: stars 10s linear infinite;
  opacity: 0.6;
}

@keyframes stars {
  from { transform: translateY(0); }
  to { transform: translateY(-200px); }
}

/* ------------------ SCREEN CARD ------------------ */
.screen {
  background: rgba(10,15,45,0.95);
  padding: 2.5rem 2rem;
  border-radius: 28px;
  text-align: center;
  box-shadow:
    0 0 40px rgba(120,150,255,0.35),
    inset 0 0 0 1px rgba(120,150,255,0.3);
  width: 420px;
  max-width: 95%;
  animation: slideIn 0.8s ease;
  position: relative;
  backdrop-filter: blur(6px);
}

.hidden { display: none; }

/* ------------------ TEXT ------------------ */
h1 {
  font-family: 'Orbitron', sans-serif;
  color: #b9c7ff;
  margin-bottom: 1rem;
  font-size: 1.6rem;
  line-height: 1.4;
  text-shadow: 0 0 12px rgba(120,150,255,0.6);
}

p {
  color: #ddd;
  font-size: 0.95rem;
  line-height: 1.5;
  margin: 0.6rem 0;
}

/* ------------------ IMAGE ------------------ */
.photo-frame {
  width: 100%;
  height: 280px;
  border-radius: 18px;
  overflow: hidden;
  margin: 1.4rem 0;
  border: 2px solid rgba(120,150,255,0.5);
  box-shadow: 0 0 25px rgba(120,150,255,0.4);
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ------------------ BUTTONS ------------------ */
.btn-wrapper {
  margin-top: 2rem;
  position: relative;
  height: 90px;
}

button {
  padding: 14px 36px;
  border-radius: 50px;
  font-size: 1rem;
  cursor: pointer;
  margin: 10px;
  transition: all 0.35s ease;
  font-family: 'Poppins', sans-serif;
  letter-spacing: 0.6px;
}

/* Neon button */
.primary {
  background: linear-gradient(135deg, #6b8cff, #b98cff);
  color: white;
  border: none;
  box-shadow: 0 0 20px rgba(150,170,255,0.8);
  animation: pulse 2.5s infinite;
}

.primary:hover {
  transform: scale(1.08);
  box-shadow: 0 0 35px rgba(180,200,255,1);
}

/* Dodge button */
.secondary {
  background: transparent;
  color: #b9c7ff;
  border: 2px dashed #6b8cff;
  position: absolute;
}

/* Back */
.back-btn {
  position: absolute;
  top: 18px;
  left: 18px;
  background: none;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  color: #b9c7ff;
}

/* ------------------ EFFECTS ------------------ */
.sparkle {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 5s linear forwards;
  pointer-events: none;
}

@keyframes floatUp {
  to {
    transform: translateY(-120vh) rotate(360deg) scale(1.5);
    opacity: 0;
  }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(30px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px rgba(150,170,255,0.6); }
  50% { box-shadow: 0 0 35px rgba(180,200,255,1); }
  100% { box-shadow: 0 0 20px rgba(150,170,255,0.6); }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->
<div class="screen" id="intro">
  <h1>Hello my universe ✨</h1>

  <div class="photo-frame">
    <img src="photo1.jpg" alt="Us">
  </div>

  <p>Out of all the stars I could’ve met…</p>
  <p>somehow, I found you 💫</p>

  <button class="primary" onclick="goToQuestion()">Continue 🚀</button>
</div>

<!-- QUESTION -->
<div class="screen hidden" id="question">
  <button class="back-btn" onclick="goBack()">⬅</button>

  <h1>No matter how fast time moves,  
  I’d still choose you in every lifetime.</h1>

  <p>Will you be my Valentine? 🌙</p>

  <div class="btn-wrapper">
    <button class="primary" onclick="sayYes()">Yes 🌌</button>
    <button class="secondary" id="noBtn" onmouseover="moveNo()">No 🫣</button>
  </div>
</div>

<!-- YES -->
<div class="screen hidden" id="yes">
  <h1>You said YES 😍✨</h1>

  <div class="photo-frame">
    <img src="photo2.jpg" alt="Love">
  </div>

  <p>You’re my favorite miracle.</p>
  <p>Happy Valentine’s Day 💜</p>

  <button class="primary" onclick="goHome()">Replay 💫</button>
</div>

<script>
const intro = document.getElementById("intro");
const question = document.getElementById("question");
const yes = document.getElementById("yes");
const noBtn = document.getElementById("noBtn");
const music = document.getElementById("bgMusic");

function goToQuestion() {
  intro.classList.add("hidden");
  question.classList.remove("hidden");
  music.play().catch(()=>{});
}

function goBack() {
  question.classList.add("hidden");
  intro.classList.remove("hidden");
}

function goHome() {
  yes.classList.add("hidden");
  intro.classList.remove("hidden");
}

function moveNo() {
  const x = Math.random() * 260 - 130;
  const y = Math.random() * 90 - 45;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

function sayYes() {
  question.classList.add("hidden");
  yes.classList.remove("hidden");
  sparkles();
}

function sparkles() {
  setInterval(() => {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.innerHTML = "✨🌙💜";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = Math.random() * 22 + 14 + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }, 250);
}
</script>

</body>
</html>
