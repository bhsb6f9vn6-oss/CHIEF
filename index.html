<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #fff;
      color: #ff4d6d;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="main">
    <h1>Hey ❤️</h1>
    <p>
      From random laughs to late-night talks,<br>
      every moment with you feels special.<br><br>
      So I have one important question…
    </p>

    <h1>Will you be my Valentine? 💌</h1>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" onclick="moveNo()">No 🙈</button>
    </div>
  </div>

  <div class="card hidden" id="yesScreen">
    <h1>YAY!!! 🥰</h1>
    <p>
      You just made my heart do a happy dance 💃🕺<br><br>
      Happy Valentine’s Day, my favorite person ❤️
    </p>
  </div>

  <script>
    function sayYes() {
      document.getElementById("main").classList.add("hidden");
      document.getElementById("yesScreen").classList.remove("hidden");
    }

    function moveNo() {
      const noBtn = document.querySelector(".no");
      const x = Math.random() * 300 - 150;
      const y = Math.random() * 300 - 150;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>

</body>
</html>
